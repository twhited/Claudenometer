[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudenometer"
version = "0.1.0"
description = "MCP server for Cronometer food logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[project.scripts]
claudenometer = "claudenometer.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudenometer"]
